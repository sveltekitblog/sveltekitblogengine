name: "[EN] Bug Report"
description: Report an error or issue encountered while using SKBE.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please verify if the issue has already been reported before submitting.
  - type: textarea
    id: description
    attributes:
      label: 1. Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 2. Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 3. Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 4. Environment
      description: Operating System, Browser, Device, etc.
      placeholder: "e.g., macOS Sonoma, Chrome 124, Cloudflare Pages"
  - type: textarea
    id: additional
    attributes:
      label: 5. Additional Context & Screenshots
      description: Add any other context, error logs, or screenshots about the problem here.
